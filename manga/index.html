<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米倉道場マンガ</title>
  <style>
    :root { --paper:#f0ebe8; --ink:#41403e; --accent:#c4a574; --muted:#6b6560; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.7; }
    header, footer, section { max-width:720px; margin:0 auto; padding:1.5rem 1.25rem; }
    header { text-align:center; padding-top:2rem; }
    h1 { margin:0 0 .35rem; font-size:clamp(1.4rem,4vw,1.85rem); }
    h2 { margin:2rem 0 .75rem; font-size:1.25rem; text-align:center; }
    .accent { width:72px; height:3px; background:var(--accent); margin:1rem auto 0; border-radius:2px; }
    figure { margin:0 0 .35rem; }
    figure img { display:block; width:100%; height:auto; }
    .intro { color:var(--muted); text-align:center; }
    footer { text-align:center; border-top:1px solid rgba(65,64,62,.12); }
    .links { display:flex; flex-wrap:wrap; gap:.75rem 1.25rem; justify-content:center; margin-top:1rem; }
    a { color:var(--ink); font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>米倉道場マンガ</h1>
    <p class="intro">強さより「おいで」</p>
    <div class="accent"></div>
  </header>
  <section>
    <h2>第1話『おいで、畳へ』</h2>
    <figure><img src="ep01/01-cover-v3.jpg" alt="第1話カバー" width="1080" height="1440" loading="eager"></figure>
    <figure><img src="ep01/02-hesitate-v3.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/03-sounds.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/04-invite-v3.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/05-daily-v3.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/06-step-v3.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/07-end-v3.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
  </section>
  <section>
    <h2>第2話『ころんでも、だいじょうぶ』</h2>
    <p class="intro">はじめての稽古。ころぶのがこわい——でも、受け身は「こわくない」を覚える練習。</p>
    <figure><img src="ep02/01-cover.jpg" alt="第2話カバー" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/02-firstday.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/03-scared.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/04-ukemi.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/05-try.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/06-fun.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep02/07-end.jpg" alt="" width="1080" height="1440" loading="lazy"></figure>
  </section>
  <footer>
    <p>漫画を読んで気になった方は、ぜひ一度道場へ。</p>
    <div class="links">
      <a href="https://yonekura-dojo.com/join/">入会案内</a>
      <a href="https://yonekura-dojo.com/class-info/">クラス案内</a>
      <a href="https://yonekura-dojo.com/contact/">お問い合わせ</a>
      <a href="https://yonekura-dojo.com/manga/">公式サイトで読む</a>
    </div>
  </footer>
</body>
</html>
