<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米倉道場マンガ 第1話『おいで、畳へ』</title>
  <meta name="description" content="米倉道場のオリジナルマンガ第1話。強さより「おいで」——道場の入口で足が止まってしまった子と、白帯の二人の物語。">
  <style>
    :root {
      --paper: #f0ebe8;
      --ink: #41403e;
      --accent: #c4a574;
      --muted: #6b6560;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }
    header {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .accent {
      width: 72px;
      height: 3px;
      background: var(--accent);
      margin: 1rem auto 0;
      border-radius: 2px;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.5rem 0 3rem;
    }
    figure {
      margin: 0 0 0.35rem;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }
    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      text-align: center;
      border-top: 1px solid rgba(65, 64, 62, 0.12);
    }
    footer a {
      color: var(--ink);
      font-weight: 600;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      justify-content: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>第1話『おいで、畳へ』</h1>
    <p>米倉道場マンガ — 強さより「おいで」</p>
    <div class="accent" aria-hidden="true"></div>
  </header>
  <main>
    <figure><img src="ep01/01-cover-v3.jpg" alt="第1話カバー『おいで、畳へ』——白帯の少年と少女が手を差し出す" width="1080" height="1440" loading="eager"></figure>
    <figure><img src="ep01/02-hesitate-v3.jpg" alt="道場の入口で足を止める子「こ、ここ…？」" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/03-sounds.jpg" alt="扉の向こうから聞こえる笑い声と畳の音" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/04-invite-v3.jpg" alt="二人が同時に手を差し出す「おいで！」「おいで、畳へ！」" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/05-daily-v3.jpg" alt="稽古の日常——受け身・寝技・帯結び" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/06-step-v3.jpg" alt="新人が畳に片足を乗せる「…のってみた」" width="1080" height="1440" loading="lazy"></figure>
    <figure><img src="ep01/07-end-v3.jpg" alt="締め——差し出す手と『米倉道場』『また、おいで。』" width="1080" height="1440" loading="lazy"></figure>
  </main>
  <footer>
    <p>漫画を読んで気になった方は、ぜひ一度道場へ。</p>
    <div class="links">
      <a href="https://yonekura-dojo.com/join/">入会案内</a>
      <a href="https://yonekura-dojo.com/class-info/">クラス案内</a>
      <a href="https://yonekura-dojo.com/contact/">お問い合わせ</a>
      <a href="https://yonekura-dojo.com/">米倉道場公式</a>
    </div>
  </footer>
</body>
</html>
